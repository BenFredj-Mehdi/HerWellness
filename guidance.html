<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pregnancy Month Guidance</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <h1 id="site-title">إرشادات للحامل حسب الشهر</h1>
        <div style="display:flex;gap:8px;align-items:center">
          <label for="lang" class="muted">اللغة</label>
          <select id="lang">
            <option value="ar">العربية (تونسية)</option>
            <option value="en">English</option>
          </select>
        </div>
      </div>

      <p id="site-lead" class="lead">اختاري الشهر اللي انتِ فيه باش تشوفي المشاكل الشائعة والحلول المقترحة.</p>

      <form id="month-form">
        <label id="label-month" for="month">الشهر</label>
        <select id="month" name="month">
          <option value="">-- اختاري الشهر --</option>
          <option value="1">الشهر 1</option>
          <option value="2">الشهر 2</option>
          <option value="3">الشهر 3</option>
          <option value="4">الشهر 4</option>
          <option value="5">الشهر 5</option>
          <option value="6">الشهر 6</option>
          <option value="7">الشهر 7</option>
          <option value="8">الشهر 8</option>
          <option value="9">الشهر 9</option>
        </select>
        <button id="submit-btn" type="submit">عرض الإرشادات</button>
      </form>

      <section id="results" aria-live="polite"></section>

      <div id="chat-suggestion" style="margin-top:14px"></div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
