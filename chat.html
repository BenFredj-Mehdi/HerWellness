<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>دردشة (معطلة)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>دردشة (معروضة كمثال ثابت)</h1>
      <p class="lead">الاتصال بالخادم مُعطل. هذا مثال للواجهة بدون أي وظائف خلفية.</p>
      <p><a href="index.html">العودة للصفحة الرئيسية</a></p>
    </main>
  </body>
</html>
    <script>
      // Server status indicator
      (function(){
        const statusEl = document.getElementById('server-status');
        const dot = statusEl.querySelector('.dot');
        const label = statusEl.querySelector('.label');
        const langSel = document.getElementById('lang');
        const texts = {
          ar: { online: 'متصل', offline: 'غير متصل', checking: 'جارِ التحقق...' },
          en: { online: 'Online', offline: 'Offline', checking: 'Checking...' }
        };

        async function checkServer(){
          label.textContent = texts[langSel.value || 'ar'].checking;
          try{
            const res = await fetch('/health', {cache:'no-store'});
            if(res.ok){
              statusEl.classList.remove('offline'); statusEl.classList.add('online');
              dot.style.background = '#22c55e';
              label.textContent = texts[langSel.value || 'ar'].online;
            }else{
              statusEl.classList.remove('online'); statusEl.classList.add('offline');
              dot.style.background = '#ef4444';
              label.textContent = texts[langSel.value || 'ar'].offline;
            }
          }catch(err){
            statusEl.classList.remove('online'); statusEl.classList.add('offline');
            dot.style.background = '#ef4444';
            label.textContent = texts[langSel.value || 'ar'].offline;
          }
        }

        // initial check and interval
        checkServer();
        const poll = setInterval(checkServer, 5000);

        // manual retry when clicking the badge
        statusEl.addEventListener('click', ()=>{ checkServer(); });

        // update label on language change
        langSel.addEventListener('change', ()=>{ checkServer(); });
      })();

      const messages = document.getElementById('messages');
      const input = document.getElementById('input');

      document.getElementById('send').addEventListener('click', ()=>{
        const txt = input.value.trim(); if(!txt) return;
        const u = document.createElement('div'); u.className='msg-user'; u.textContent='أنت: '+txt; messages.appendChild(u);
        input.value='';
        // Static demo: no backend. Show a friendly placeholder reply.
        const b = document.createElement('div'); b.className='msg-bot'; b.textContent='المساعد: هذا عرض تجريبي بدون اتصال بالخادم.';
        messages.appendChild(b);
        messages.scrollTop = messages.scrollHeight;
      });

      document.getElementById('reset').addEventListener('click', ()=>{ messages.innerHTML=''; });
    </script>
  </body>
</html>
