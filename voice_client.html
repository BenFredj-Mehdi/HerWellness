<!doctype html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>مكالمة صوتية - النسخة التجريبية</title>
    <style>
      body{font-family:Segoe UI, Roboto, Arial;background:transparent;color:#e6f7ff;padding:18px}
      .panel{max-width:820px;margin:12px auto;background:rgba(255,255,255,0.03);padding:18px;border-radius:12px}
      button{padding:10px 14px;border-radius:10px;border:none;background:linear-gradient(90deg,#06b6d4,#7c3aed);color:white}
      #transcripts{margin-top:12px}
      .entry{margin-bottom:8px;padding:8px;border-radius:8px;background:rgba(255,255,255,0.02)}
      .user{color:#bff3ff}
      .ai{color:#fffbeb}
      .meter{height:8px;background:#083244;border-radius:6px;overflow:hidden;margin-top:8px}
      .meter > i{display:block;height:100%;background:linear-gradient(90deg,#06b6d4,#7c3aed);width:0%}
    </style>
  </head>
  <body>
    <div class="panel">
      <h2>مكالمة صوتية - النسخة التجريبية</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="connect">Connect</button>
        <button id="disconnect" disabled>Disconnect</button>
        <button id="reset">Reset Conversation</button>
      </div>

      <div style="margin-top:12px">
        <label>Volume</label>
        <div class="meter"><i id="level"></i></div>
      </div>

      <div id="transcripts"></div>
    </div>

    <script>
      let ws;
      let mediaStream;
      let processor;
      let audioContext;

      const connectBtn = document.getElementById('connect');
      const disconnectBtn = document.getElementById('disconnect');
      const resetBtn = document.getElementById('reset');
      const transcripts = document.getElementById('transcripts');
      const levelBar = document.getElementById('level');

      function appendEntry(role, text){
        const el = document.createElement('div');
        el.className = 'entry ' + (role==='user'? 'user':'ai');
        el.textContent = (role==='user'? 'أنت: ' : 'المساعد: ') + text;
        transcripts.prepend(el);
      }

      async function startStream(){
        ws = new WebSocket('ws://' + location.host + '/ws/demo');
        ws.addEventListener('open', ()=>{
          connectBtn.disabled = true; disconnectBtn.disabled = false;
        });

        ws.addEventListener('message', async (ev)=>{
          const msg = JSON.parse(ev.data);
          if(msg.type === 'partial_transcript'){
            console.log('partial', msg.text);
          }else if(msg.type === 'final_transcript'){
            appendEntry('user', msg.text);
          }else if(msg.type === 'tts_audio'){
            // decode and play
            const audioBytes = atob(msg.audio_base64);
            // convert to Uint8Array
            const arr = new Uint8Array(audioBytes.length);
            for(let i=0;i<audioBytes.length;i++) arr[i] = audioBytes.charCodeAt(i);
            // create blob and play
            const blob = new Blob([arr], {type:'audio/wav'});
            const url = URL.createObjectURL(blob);
            const a = new Audio(url);
            a.play();
            appendEntry('ai', '[صوت متشغّل]');
          }
        });

        mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(mediaStream);
        processor = audioContext.createScriptProcessor(4096,1,1);

        source.connect(processor);
        processor.connect(audioContext.destination);

        processor.onaudioprocess = function(e){
          const input = e.inputBuffer.getChannelData(0);
          // compute RMS for volume meter
          let sum = 0.0; for(let i=0;i<input.length;i++) sum += input[i]*input[i];
          const rms = Math.sqrt(sum / input.length);
          levelBar.style.width = Math.min(100, Math.floor(rms*300)) + '%';

          // convert float32 to 16-bit PCM
          const pcm16 = floatTo16BitPCM(input);
          const b64 = arrayBufferToBase64(pcm16.buffer);
          const packet = {type:'audio', audio_base64: b64, sample_rate: audioContext.sampleRate};
          if(ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(packet));
        }
      }

      function stopStream(){
        if(processor) processor.disconnect();
        if(audioContext) audioContext.close();
        if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop());
        if(ws) ws.close();
        connectBtn.disabled = false; disconnectBtn.disabled = true;
      }

      connectBtn.onclick = ()=> startStream();
      disconnectBtn.onclick = ()=> stopStream();
      resetBtn.onclick = ()=>{ if(ws && ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({type:'control', action:'reset'})); }

      function floatTo16BitPCM(float32Array){
        const buffer = new ArrayBuffer(float32Array.length * 2);
        const view = new DataView(buffer);
        let offset = 0;
        for (let i = 0; i < float32Array.length; i++, offset += 2) {
          let s = Math.max(-1, Math.min(1, float32Array[i]));
          view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        }
        return new Uint8Array(buffer);
      }

      function arrayBufferToBase64(buffer){
        let binary = '';
        const bytes = new Uint8Array(buffer);
        const len = bytes.byteLength;
        for (let i = 0; i < len; i++) binary += String.fromCharCode(bytes[i]);
        return btoa(binary);
      }
    </script>
  </body>
</html>
