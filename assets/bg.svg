<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#071428" />
      <stop offset="50%" stop-color="#071a2a" />
      <stop offset="100%" stop-color="#071428" />
    </linearGradient>
    <radialGradient id="blob" cx="30%" cy="20%">
      <stop offset="0%" stop-color="#0ea5a4" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0ea5a4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0ea5a4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blob2" cx="70%" cy="80%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0" />
    </radialGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="b" />
      <feBlend in="SourceGraphic" in2="b" mode="normal" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#g1)" />

  <g filter="url(#f1)">
    <circle cx="380" cy="160" r="220" fill="url(#blob)" />
    <circle cx="1240" cy="720" r="260" fill="url(#blob2)" />
    <circle cx="1000" cy="200" r="140" fill="#00bcd4" opacity="0.06" />
  </g>

  <!-- subtle grid lines -->
  <g opacity="0.06" stroke="#9bd8e6" stroke-width="1">
    <path d="M0 60 L1600 60 M0 120 L1600 120 M0 180 L1600 180" />
  </g>

  <!-- animated dots (CSS will control animation via background-position) -->
  <g opacity="0.12" fill="#7dd3fc">
    <circle cx="200" cy="600" r="3" />
    <circle cx="420" cy="720" r="2.5" />
    <circle cx="860" cy="420" r="2" />
    <circle cx="1400" cy="540" r="2.5" />
  </g>
</svg>
